# Documentation tooling only; the lance-csr package itself lives in python/.
[project]
name = "lance-csr-docs"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "mkdocstrings==1.0.8",
    "mkdocstrings-python==2.0.10",
    "zensical==0.0.72",
]

[tool.uv]
package = false
default-groups = ["docs"]
