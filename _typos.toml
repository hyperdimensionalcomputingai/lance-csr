[default]
# Git commit hashes, such as the benchmark commits pinned in docs/sync_benchmarks.py.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# NetworKit, the graph library icebug is forked from.
Networ = "Networ"
# The `outWeights` field of GraphExport, lowercased in TypeDoc anchors.
outweights = "outweights"
