[package]
name = "lance-csr-benches"
version = "0.3.0"
edition = "2021"
publish = false
description = "Benchmarks for lance-csr (not published)"

[dependencies]
lance-csr = { path = "../lance-csr", version = "0.3.0" }
lance = "13.0.0"
arrow-array = "58"
arrow-schema = "58"
criterion = { version = "0.5", features = ["async", "async_tokio", "html_reports"] }
futures = "0.3"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "graph_execution"
harness = false
