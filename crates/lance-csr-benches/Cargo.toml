[package]
name = "lance-csr-benches"
version = "0.12.0"
edition = "2021"
publish = false
description = "Benchmarks for lance-csr (not published)"

[dependencies]
lance-csr = { path = "../lance-csr", version = "0.12.0" }
lance = "14.0.3"
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
datafusion = { version = "54.0.0", default-features = false }
criterion = { version = "0.5", features = ["async", "async_tokio", "html_reports"] }
futures = "0.3"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "graph_execution"
harness = false
