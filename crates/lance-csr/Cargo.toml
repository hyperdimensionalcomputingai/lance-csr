[package]
name = "lance-csr"
version = "0.14.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The lance-csr Authors"]
repository = "https://github.com/hyperdimensionalcomputingai/lance-csr"
homepage = "https://lance-csr.hdclabs.ai/"
readme = "README.md"
description = "Graph query engine for Lance datasets with Cypher support"
keywords = ["lance", "graph", "cypher", "query", "datafusion"]
categories = ["database", "data-structures", "science"]

[dependencies]
ahash = "0.8"
arrow = { version = "58.0.0", features = ["prettyprint", "ipc_compression"] }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
datafusion = { version = "54.0.0", default-features = false, features = [
    "nested_expressions",
    "math_expressions",
    "regex_expressions",
    "unicode_expressions",
    "crypto_expressions",
    "encoding_expressions",
    "datetime_expressions",
    "string_expressions",
    "parquet",
] }
datafusion-common = "54.0.0"
datafusion-expr = "54.0.0"
datafusion-sql = "54.0.0"
datafusion-functions-aggregate = "54.0.0"
futures = "0.3"
lance = "14.0.3"
lance-linalg = "14.0.3"
lance-namespace = "14.0.3"
lance-table = "14.0.3"
log = "0.4"
rayon = "1.12"
nom = "7.1"
object_store = "0.14.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
tokio = { version = "1.37", features = ["rt", "time"] }

[dev-dependencies]
futures = "0.3"
lance-arrow = "14.0.3"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "time"] }
