[package]
name = "lance-csr-python"
version = "0.3.0"
edition = "2021"
authors = ["The lance-csr Authors"]
publish = false

[lib]
name = "_internal"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "58", features = ["pyarrow"] }
arrow-array = "58"
arrow-schema = "58"
arrow-ipc = "58"
datafusion = { version = "54", default-features = false }
futures = "0.3"
lance = "13.0.0"
lance-csr = { path = "../lance-csr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py312", "py-clone"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
