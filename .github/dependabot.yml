# Keep the commit-SHA pins on GitHub Actions current. One grouped PR a week, and only for
# releases at least a week old, so a compromised release has time to be caught first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # Flag new lance majors, which we follow (see RELEASE.md); RELEASE.md's checklist catches minors and patches.
  # arrow and datafusion move with lance, by hand. Since lance 1.0 every datafusion bump has shipped
  # in a lance major, so this PR is also the signal that a newer datafusion is usable here.
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/lance-csr-python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "lance*"
    ignore:
      - dependency-name: "lance*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      lance:
        patterns:
          - "lance*"
