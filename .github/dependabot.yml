# Keep the commit-SHA pins on GitHub Actions current. One grouped PR a week, and only for
# releases at least a week old, so a compromised release has time to be caught first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # Flag new lance majors, which we follow (see RELEASE.md); RELEASE.md's checklist catches minors and patches.
  # arrow and datafusion move with lance, by hand. Since lance 1.0 every datafusion bump has shipped
  # in a lance major, so this PR is also the signal that a newer datafusion is usable here.
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/lance-csr-python
      - /crates/lance-csr-node
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "lance*"
    ignore:
      - dependency-name: "lance*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      lance:
        patterns:
          - "lance*"
  # The npm package's build and test tools, grouped into one PR. apache-arrow is a peer
  # dependency, so a new major also means widening the range users can install.
  - package-ecosystem: npm
    directory: /nodejs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
  # TypeDoc, which generates the TypeScript API reference. It supports TypeScript up to 6.0, so
  # TypeScript stays on 6 here until TypeDoc supports 7.
  - package-ecosystem: npm
    directory: /nodejs/typedoc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      typedoc:
        patterns:
          - "*"
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
