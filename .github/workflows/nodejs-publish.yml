# Build, test and publish the lance-csr npm packages: the `lance-csr` package (TypeScript and
# the native loader) and one package per platform holding its native binary: Linux x86-64
# and aarch64 (glibc 2.28), native Apple Silicon (macOS arm64) and Windows x86-64, the
# platforms the Python wheels cover.
#
# Pull requests that change how the packages are built (this workflow, the package check,
# nodejs/.cargo/, the platform packages) build and test them without publishing. A release
# builds and tests every package before publishing, so it needs no separate dry run; see
# RELEASE.md. A published GitHub release (tag vX.Y.Z) publishes to npm after every build and
# test passes, through npm trusted publishing and the protected `npm` environment; so does
# a manual run with mode=release. mode=dry_run builds and tests only. This runs alongside
# python-publish.yml, from the same release.
name: Node.js Publish

on:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/nodejs-publish.yml
      - ci/check_npm_package.mjs
      - nodejs/.cargo/**
      - nodejs/npm/**
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run: build and test only; release: build, test and publish to npm"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build-linux:
    # Built on the host with zig as the linker, targeting glibc 2.28 (RHEL 8, Ubuntu 20.04
    # and newer), as the Python wheels are. Each architecture builds natively on its own
    # runner. Cargo runs from nodejs/ so nodejs/.cargo/config.toml applies.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux-x64-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install build dependencies
        run: |
          # protoc is needed by Lance's build scripts, not by package users.
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          # Pinned so release binaries are built with a known toolchain. The ziglang package
          # ships a zig binary: put its directory on PATH, where cargo-zigbuild looks for it.
          uv tool install cargo-zigbuild==0.24.1 --with ziglang==0.17.1
          "$(uv tool dir)/cargo-zigbuild/bin/python" -c "import os, ziglang; print(os.path.dirname(ziglang.__file__))" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.platform }} binary
        working-directory: nodejs
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cargo zigbuild --release --locked --manifest-path ../crates/lance-csr-node/Cargo.toml \
            --target "$ARCH-unknown-linux-gnu.2.28"
          cp "../crates/lance-csr-node/target/$ARCH-unknown-linux-gnu/release/liblance_csr_node.so" \
            "lance-csr.$PLATFORM.node"
          sha256sum "lance-csr.$PLATFORM.node"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-binary-${{ matrix.platform }}
          path: nodejs/lance-csr.${{ matrix.platform }}.node
          if-no-files-found: error

  build-macos:
    # GitHub's macos-15 runners are Apple Silicon, so this builds natively.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install protobuf
      - name: Build Apple Silicon binary
        working-directory: nodejs
        run: |
          cargo build --release --locked --manifest-path ../crates/lance-csr-node/Cargo.toml \
            --target aarch64-apple-darwin
          cp ../crates/lance-csr-node/target/aarch64-apple-darwin/release/liblance_csr_node.dylib \
            lance-csr.darwin-arm64.node
          shasum -a 256 lance-csr.darwin-arm64.node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-binary-darwin-arm64
          path: nodejs/lance-csr.darwin-arm64.node
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        # protoc comes from its GitHub release: Chocolatey's feed is intermittently unreachable from runners.
        run: |
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          Invoke-WebRequest https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "57EA59E9F551AD8D71FFAA9B5CFBE0CA1F4E720972A1DB7EC2D12AB44BFF9383") { throw "protoc checksum mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP\protoc"
          "$env:RUNNER_TEMP\protoc\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build Windows x86-64 binary
        working-directory: nodejs
        shell: bash
        run: |
          cargo build --release --locked --manifest-path ../crates/lance-csr-node/Cargo.toml \
            --target x86_64-pc-windows-msvc
          cp ../crates/lance-csr-node/target/x86_64-pc-windows-msvc/release/lance_csr_node.dll \
            lance-csr.win32-x64-msvc.node
          sha256sum lance-csr.win32-x64-msvc.node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-binary-win32-x64-msvc
          path: nodejs/lance-csr.win32-x64-msvc.node
          if-no-files-found: error

  pack:
    # The tarballs packed here are the ones the tests install and the publish job uploads.
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Release builds restore no caches.
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-binary-*
          merge-multiple: true
          path: binaries
      - name: Pack the main and platform packages
        working-directory: nodejs
        run: |
          npm ci
          npm run build
          mkdir ../packages
          for dir in npm/*/; do
            cp ../binaries/lance-csr."$(basename "$dir")".node "$dir"
            (cd "$dir" && npm pack --pack-destination ../../../packages)
          done
          # Each platform package, at this version, is an optional dependency: npm installs
          # the one whose os, cpu and libc match, and the loader in native.js requires it.
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.optionalDependencies = Object.fromEntries(
              fs.readdirSync("npm").map((dir) => [
                JSON.parse(fs.readFileSync(`npm/${dir}/package.json`, "utf8")).name,
                pkg.version,
              ]),
            );
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm pack --pack-destination ../packages
          ls -l ../packages
          sha256sum ../packages/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: packages/*.tgz
          if-no-files-found: error

  test:
    # Each platform's release binary runs the whole test suite on every supported Node.js
    # version, and the packed tarballs are installed into a fresh project and checked there,
    # with Rust removed from PATH: a package that silently needed compiling would fail here.
    needs: [pack]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
        node: ["22", "24", "26"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ci
            nodejs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-binary-*
          merge-multiple: true
          path: binaries
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packages
      - name: Run the test suite on the release binary, then check the installed packages
        shell: bash
        run: |
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -e cargo -e rustup | paste -sd: -)
          ! command -v cargo && ! command -v rustc
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) platform=linux-x64-gnu ;;
            Linux-aarch64) platform=linux-arm64-gnu ;;
            macOS-*) platform=darwin-arm64 ;;
            Windows-*) platform=win32-x64-msvc ;;
          esac
          cp "binaries/lance-csr.$platform.node" nodejs/
          (cd nodejs && npm ci && npm test)
          # A fresh project outside the source tree, installing this platform's tarballs by
          # path so npm's copy of the same version can't stand in. It has no lockfile by
          # design: it installs what a user would, with apache-arrow pinned.
          app="$RUNNER_TEMP/app"
          mkdir "$app"
          cp ci/check_npm_package.mjs "$app/"
          cd "$app"
          npm init -y > /dev/null
          npm pkg set type=module
          version=$(node -p 'require(process.argv[1]).version' "$GITHUB_WORKSPACE/nodejs/package.json")
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/packages/lance-csr-$version.tgz" \
            "$GITHUB_WORKSPACE/packages/lance-csr-$platform-$version.tgz" apache-arrow@21.2.0
          node check_npm_package.mjs

  publish:
    needs: [pack, test]
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/lance-csr
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: nodejs/package.json
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./nodejs/package.json").version')
          test "$TAG" = "v$version" || {
            echo "Release tag $TAG does not match version $version"; exit 1; }
      # npm 11.5.1 or newer publishes through trusted publishing (OIDC), with provenance.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packages
      - name: Publish to npm
        # The platform packages go first, so `lance-csr` never points at a missing one. A
        # version npm already has is skipped, so rerunning after a partial failure is safe.
        run: |
          version=$(node -p 'require("./nodejs/package.json").version')
          publish() {
            if npm view "$1@$version" version > /dev/null 2>&1; then
              echo "$1@$version is already on npm"
            else
              npm publish --access public "$2"
            fi
          }
          for tarball in packages/lance-csr-*-"$version".tgz; do
            name=$(basename "$tarball" "-$version.tgz")
            publish "$name" "$tarball"
          done
          publish lance-csr "packages/lance-csr-$version.tgz"
