# Audit the workflows and Dependabot config with zizmor: unpinned actions, template
# injection, cache poisoning, persisted credentials and broad token permissions.
name: Workflow Audit
on:
  push:
    branches:
      - main
    paths:
      - .github/**
  pull_request:
    paths:
      - .github/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Run zizmor
        # The token enables the online audits: impostor commits and known-vulnerable actions.
        run: uvx zizmor@1.32.0 --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}
