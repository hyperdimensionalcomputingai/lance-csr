name: Docs
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - zensical.toml
      # The Python API reference is generated from these docstrings.
      - python/python/lance_csr/**
      # Pages include this example with --8<--.
      - crates/lance-csr/examples/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      # The Python API reference is generated from these docstrings.
      - python/python/lance_csr/**
      # Pages include this example with --8<--.
      - crates/lance-csr/examples/**
      - .github/workflows/docs.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Checks that the site builds; Cloudflare Pages builds and hosts it.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Build the site
        run: uv run --project docs --locked zensical build --strict
