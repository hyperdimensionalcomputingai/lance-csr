name: Docs
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - zensical.toml
      # The Python API reference is generated from these docstrings.
      - python/python/lance_csr/**
      # Pages include this example with --8<--.
      - crates/lance-csr/examples/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      # The Python API reference is generated from these docstrings.
      - python/python/lance_csr/**
      # Pages include this example with --8<--.
      - crates/lance-csr/examples/**
      - .github/workflows/docs.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Checks that the site builds; Cloudflare Pages builds and hosts it.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the site
        run: uv run --project docs --locked zensical build --strict
