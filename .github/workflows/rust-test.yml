name: Rust Tests
on:
  push:
    branches:
      - main
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rust-test.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rust-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=line-tables-only"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # rust-toolchain.toml selects the toolchain.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "lance-csr-deps"
          # Pull requests restore main's cache but don't save copies that crowd it out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
      - name: Build tests
        run: cargo test --workspace --no-run
      - name: Run tests
        run: cargo test --workspace
      # The Rust guide includes this example; run it so the documented code works.
      # Run the binary the workspace test build made: `cargo run -p lance-csr` selects
      # different features and would recompile lance-csr.
      - name: Run embedded example
        run: target/debug/examples/embedded_query
      - name: Check benchmarks
        run: cargo check -p lance-csr-benches --benches
